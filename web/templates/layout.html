<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}NFL Toolkit{% endblock %}</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #0f1419; color: #e6e6e6; }
  header { background: #16202c; padding: 14px 24px; border-bottom: 1px solid #243240; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; }
  header a { color: #7fb3ff; text-decoration: none; margin-right: 18px; font-weight: 600; }
  header a:hover { color: #bcd6ff; }
  .nav-label { color: #7a8a99; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-right: 12px; }
  .nav-group { display: inline-flex; align-items: center; flex-wrap: wrap; }
  .nav-sep { border-left: 1px solid #243240; height: 18px; margin-right: 18px; }
  .wrap { max-width: 1120px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 22px; } h2 { font-size: 16px; color: #9fd0ff; margin-top: 26px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #202c38; }
  th { color: #8aa; }
  tr:hover td { background: #15202c; }
  .card { background: #16202c; border: 1px solid #243240; border-radius: 8px; padding: 14px 18px; margin-top: 14px; }
  .pill { background: #1d2b3a; border: 1px solid #2c4055; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .win { color: #5fd38a; } .loss { color: #e07373; }
  input, select { background: #0f1419; color: #e6e6e6; border: 1px solid #2c4055; padding: 6px 8px; border-radius: 6px; }
  a { color: #7fb3ff; } a:hover { color: #bcd6ff; }
  .muted { color: #7a8a99; font-size: 12px; }
  .notice { background: #2a2118; border: 1px solid #5c4526; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #e8c98a; }
  .bar { height: 6px; background: #1d2b3a; border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: #5fd38a; }
</style>
</head>
<body>
<header>
  <span class="nav-group">
    <span class="nav-label">FD nation</span>
    <a href="/league">League</a>
    <a href="/team">My Team</a>
    <a href="/cron">Cron</a>
  </span>
  <span class="nav-sep"></span>
  <span class="nav-group">
    <span class="nav-label">Prediction engines</span>
    <a href="/dashboard">Dashboard</a>
    <a href="/players">Players</a>
    <a href="/predictions">Win Predictions</a>
    <a href="/ratings">Ratings</a>
    <a href="/strategy?team=BUF">Strategy</a>
    <a href="/sos">SOS</a>
  </span>
</header>
<div class="wrap">
{% block body %}{% endblock %}
</div>
<style>
  /* live points feed (nfl-webd /ws) */
  .live-badge { font-size: 10px; font-weight: 700; letter-spacing: .06em;
                padding: 2px 8px; border-radius: 8px; vertical-align: middle;
                background: #243240; color: #7a8a99; }
  .live-badge.on { background: #12351f; color: #4ade80; }
  .live-badge.off { background: #3a2020; color: #f87171; }
  .live-on { color: #4ade80; }
  .live-drift { color: #fbbf24; }
  .live-pts { display: inline-block; margin-left: 6px; font-size: 11px;
              font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums; }
  .live-pts::before { content: "● "; font-size: 8px; vertical-align: 1px; }
</style>
<script>
/* Live points: WebSocket push from nfl-webd (/ws), fed by the ESPN poller
   under exact Yahoo league weights. On drift vs a fresh Yahoo snapshot the
   affected team shows Yahoo's verified number instead (amber). Falls back
   to polling /live-points if the socket drops. Week-guarded: a payload for
   a different week never touches the page. */
(function () {
  var targets = document.querySelectorAll('[data-live-team],[data-live-player],[data-live-def],[data-live-fanpts],[data-live-fanpts-def]');
  if (!targets.length) return;
  var statusEl = document.getElementById('live-status');
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ')
      .replace(/\b(sr|jr|ii|iii|iv|v)\b/g, '').replace(/\s+/g, ' ').trim();
  }
  function weekOk(el, d) {
    var box = el.closest('[data-week]');
    if (!box || d.week == null) return true;
    return String(d.week) === box.getAttribute('data-week');
  }
  function apply(d) {
    if (!d || !d.players) return;
    var recon = d.reconciliation || {};
    document.querySelectorAll('[data-live-team]').forEach(function (el) {
      if (!weekOk(el, d)) return;
      var t = el.getAttribute('data-live-team');
      if (recon.drift) {
        var c = (recon.comparisons || []).filter(function (x) { return x.team === t; })[0];
        if (c) {
          el.textContent = Number(c.yahoo).toFixed(2);
          el.classList.add('live-drift');
          el.title = 'Yahoo-verified total (live estimate drifted)';
        }
        return;
      }
      var v = (d.totals || {})[t];
      if (v == null) return;
      el.textContent = Number(v).toFixed(2);
      el.classList.add('live-on');
      el.title = 'live total — Yahoo weights, ESPN stats';
    });
    document.querySelectorAll('[data-live-player]').forEach(function (el) {
      if (!weekOk(el, d)) return;
      var p = (d.players || {})[norm(el.getAttribute('data-live-player'))];
      var badge = el.querySelector('.live-pts');
      if (!p) { if (badge) badge.remove(); return; }
      if (!badge) { badge = document.createElement('span'); badge.className = 'live-pts'; el.appendChild(badge); }
      badge.textContent = Number(p.points).toFixed(2);
      badge.title = 'live fantasy points (Yahoo weights)';
    });
    document.querySelectorAll('[data-live-fanpts]').forEach(function (el) {
      if (!weekOk(el, d)) return;
      var p = (d.players || {})[norm(el.getAttribute('data-live-fanpts'))];
      if (!p) return;
      el.textContent = Number(p.points).toFixed(2);
      el.classList.add('live-on');
      el.title = 'live fantasy points (Yahoo weights)';
    });
    document.querySelectorAll('[data-live-fanpts-def]').forEach(function (el) {
      if (!weekOk(el, d)) return;
      var v = (d.def_named || {})[el.getAttribute('data-live-fanpts-def')];
      if (v == null) return;
      el.textContent = Number(v).toFixed(2);
      el.classList.add('live-on');
      el.title = 'live DEF points (Yahoo weights)';
    });
    document.querySelectorAll('[data-live-def]').forEach(function (el) {
      if (!weekOk(el, d)) return;
      var v = (d.def_named || {})[el.getAttribute('data-live-def')];
      var badge = el.querySelector('.live-pts');
      if (v == null) { if (badge) badge.remove(); return; }
      if (!badge) { badge = document.createElement('span'); badge.className = 'live-pts'; el.appendChild(badge); }
      badge.textContent = Number(v).toFixed(2);
      badge.title = 'live DEF points (Yahoo weights)';
    });
    if (statusEl) {
      statusEl.textContent = 'LIVE';
      statusEl.className = 'live-badge on';
      statusEl.title = 'updated ' + (d.captured_at || '');
    }
  }
  function fallback() {
    fetch('/live-points').then(function (r) { return r.ok ? r.json() : null; })
      .then(apply).catch(function () {});
  }
  var retry = 1000;
  function connect() {
    var ws;
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    } catch (e) { fallback(); return; }
    ws.onmessage = function (ev) { try { apply(JSON.parse(ev.data)); } catch (e) {} };
    ws.onopen = function () { retry = 1000; };
    ws.onclose = function () {
      if (statusEl) { statusEl.textContent = 'OFFLINE'; statusEl.className = 'live-badge off'; }
      fallback();
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 30000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  fallback();
  connect();
  setInterval(fallback, 60000);
})();
</script>
</body>
</html>
