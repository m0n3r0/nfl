[package]
name = "nfl-webd"
version = "0.1.0"
edition = "2021"
description = "FD nation web front door: all pages native axum — fantasy + prediction-engine analytics from local artifacts (jra-van-re jv-webd method)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
minijinja = { version = "2", features = ["urlencode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"

[profile.release]
strip = true
lto = "thin"
